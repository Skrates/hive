name: edge-runpod-image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "deploy/machines/edge-runpod/**"
      - ".github/workflows/edge-runpod-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: [self-hosted, cx53]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/machines/edge-runpod/Dockerfile
          push: true
          tags: |
            ghcr.io/skrates/hive-edge-runpod:latest
            ghcr.io/skrates/hive-edge-runpod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
